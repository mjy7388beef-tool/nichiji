<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>端末データ確認（読み取り専用）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
         background: #f5f5f2; color: #1a1a1a; padding: 16px; line-height: 1.6; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .safe { background: #e8f5e9; border: 1px solid #a5d6a7; color: #2e7d32;
          padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
          padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #eee; text-align: left; }
  th { background: #fafaf8; font-size: 12px; color: #666; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  .has  { color: #2e7d32; font-weight: 700; }
  .none { color: #bbb; }
  .warn { background: #fff8ec; border-left: 4px solid #e8a33d; color: #b26a00;
          padding: 10px 14px; border-radius: 4px; font-size: 13px; margin: 12px 0; }
  button { width: 100%; padding: 14px; font-size: 15px; font-weight: 700;
           border: none; border-radius: 8px; background: #1f3a5f; color: #fff;
           cursor: pointer; margin-top: 8px; font-family: inherit; }
  button.sub { background: #eee; color: #444; }
  pre { background: #1a1a1a; color: #a5d6a7; padding: 12px; border-radius: 6px;
        font-size: 10px; overflow: auto; max-height: 240px; white-space: pre-wrap;
        word-break: break-all; margin-top: 10px; }
  .muted { color: #888; font-size: 12px; }
</style>
</head>
<body>

<h1>端末データ確認</h1>
<div class="safe">
  ✅ このページは<b>見るだけ</b>です。データの書き換え・送信・削除は一切しません。
</div>

<div id="out"></div>

<script>
// ================================================================
// 端末に残っているデータを表示するだけのページ（読み取り専用）
// 同期処理は一切読み込まないので、開いても中身が変わりません。
// ================================================================
// このページは同期処理を一切読み込まないため、開いても中身は変わらない

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function 日次の中身(key) {
  const s = localStorage.getItem(key);
  if (!s) return null;
  try {
    const o = JSON.parse(s);
    const 日 = Object.keys(o).filter(d => o[d] && Object.keys(o[d]).length > 0)
                            .map(Number).sort((a,b)=>a-b);
    let 項目数 = 0;
    日.forEach(d => { 項目数 += Object.keys(o[String(d)]).length; });
    return { 日, 項目数, raw: s };
  } catch(e) { return null; }
}

const out = [];

// ---- ① 日次データ（店舗ごと・月ごと）----
const 日次キー = Object.keys(localStorage).filter(k => /^daily_\d{4}_.+_\d+$/.test(k)).sort();
let h = '<div class="card"><h2>📅 この端末にある日次データ</h2>';
if (日次キー.length === 0) {
  h += '<p class="none">日次データは1件もありません。</p>';
} else {
  h += '<table><tr><th>年月</th><th>店舗</th><th class="n">入力日数</th><th>入力された日</th></tr>';
  日次キー.forEach(k => {
    const m = k.match(/^daily_(\d{4})_(.+)_(\d+)$/);
    const d = 日次の中身(k);
    if (!d) return;
    const 強調 = m[2] === '松' ? ' style="background:#fffde7"' : '';
    h += `<tr${強調}><td>${m[1]}/${m[3]}</td><td>${esc(m[2])}</td>` +
         `<td class="n ${d.日.length?'has':'none'}">${d.日.length}日</td>` +
         `<td class="muted">${d.日.join(', ') || '—'}</td></tr>`;
  });
  h += '</table>';
}
h += '</div>';
out.push(h);

// ---- ② 松の7月を詳しく ----
const 松キー = Object.keys(localStorage).filter(k => /^daily_\d{4}_松_\d+$/.test(k)).sort();
h = '<div class="card"><h2>🔍 「松」の日次データ（詳細）</h2>';
if (松キー.length === 0) {
  h += '<p class="none">松の日次データは、この端末にはありません。</p>';
} else {
  松キー.forEach(k => {
    const m = k.match(/^daily_(\d{4})_松_(\d+)$/);
    const d = 日次の中身(k);
    if (!d) return;
    h += `<p><b>${m[1]}年度 ${m[2]}月</b> … ${d.日.length}日分 / のべ${d.項目数}項目</p>`;
    h += `<p class="muted">入力がある日: ${d.日.join(', ') || 'なし'}</p>`;
  });
}
h += '</div>';
out.push(h);

// ---- ③ 未送信の記録 ----
const 未送信 = (() => {
  try { return JSON.parse(localStorage.getItem('_dirty_keys_daily') || localStorage.getItem('_dirty_keys') || '[]'); }
  catch(e) { return []; }
})();
h = '<div class="card"><h2>📤 まだ送信できていないデータ</h2>';
if (未送信.length === 0) {
  h += '<p class="none">ありません（すべて送信済み、または記録が消えています）。</p>';
} else {
  h += '<p class="has">' + 未送信.length + '件あります。まだクラウドに届いていません。</p>';
  h += '<p class="muted">' + 未送信.map(esc).join('<br>') + '</p>';
}
h += '</div>';
out.push(h);

// ---- ④ 全データの控えを取る ----
h = '<div class="card"><h2>💾 この端末のデータを控える</h2>' +
    '<p class="muted">下のボタンで、この端末にあるデータをすべて書き出せます。' +
    'ファイルを送っていただければ、そこから復元できます。</p>' +
    '<button onclick="ダウンロード()">📥 ファイルに保存する</button>' +
    '<button class="sub" onclick="表示()">画面に表示する（コピー用）</button>' +
    '<div id="dump"></div></div>';
out.push(h);

document.getElementById('out').innerHTML = out.join('');

function 全部集める() {
  const o = {};
  Object.keys(localStorage).forEach(k => {
    if (k === 'cloud_pwd') return;            // パスワードは含めない
    o[k] = localStorage.getItem(k);
  });
  return JSON.stringify({
    取得日時: new Date().toString(),
    端末: navigator.userAgent,
    データ: o,
  }, null, 1);
}
function ダウンロード() {
  const blob = new Blob([全部集める()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '端末データ_' + new Date().toISOString().slice(0,19).replace(/[:T]/g,'-') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function 表示() {
  document.getElementById('dump').innerHTML = '<pre>' + esc(全部集める()) + '</pre>';
}
</script>
</body>
</html>
